name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        OS: [ubuntu-latest, windows-latest]
        BUILD_TARGET: [release] # refers to a cargo profile
    runs-on: ${{matrix.OS}}
    steps:
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@v6
      - name: Syntax check
        run: cargo clippy -- -D warnings
      - name: Build binaries in "${{ matrix.BUILD_TARGET }}" mode
        run: cargo build --profile ${{ matrix.BUILD_TARGET }} --verbose
      - name: Run tests in "${{ matrix.BUILD_TARGET }}" mode
        run: cargo test --profile ${{ matrix.BUILD_TARGET }} --verbose
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: umni-${{runner.os}}
          path: target/${{ matrix.BUILD_TARGET }}/${{runner.os == 'Linux' && 'umni' || 'umni.exe'}}

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: umni-*
          merge-multiple: true
          path: artifacts
      - name: Create GitHub Release
        run: gh release create "build-${{ github.run_id }}" artifacts/* --generate-notes -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
